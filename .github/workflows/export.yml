# Construit le jeu pour Windows (.exe), Linux / Steam Deck (.x86_64) et macOS (.app universelle) automatiquement.
# - À chaque Release publiée (ou tag « v* ») : ajoute RondeDesVeilleurs_Windows.zip à la Release.
# - Lancement manuel (onglet Actions > Export Windows > Run workflow) :
#     * champ « version » rempli (ex. v1.2.0) → crée le tag et la Release avec l'exe ;
#     * champ vide → exe disponible seulement dans les artefacts.
name: Export

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.2.0). Laisser vide pour un simple test."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer Godot 4.3 et les modèles d'export Windows, Linux et macOS
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -qj Godot_v4.3-stable_export_templates.tpz templates/windows_release_x86_64.exe templates/linux_release.x86_64 templates/macos.zip templates/version.txt \
            -d ~/.local/share/godot/export_templates/4.3.stable
          rm Godot_v4.3-stable_export_templates.tpz

      # La version du jeu vient du tag : elle est écrite dans le projet avant l'export
      # (elle est affichée sur l'écran-titre).
      - name: Numéro de version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          V="$INPUT_VERSION"
          [ -z "$V" ] && V="$RELEASE_TAG"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then V="$GITHUB_REF_NAME"; fi
          V="${V#v}"
          if echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            sed -i "s/^config\/version=.*/config\/version=\"$V\"/" project.godot
            sed -i -E "s/(file_version|product_version)=\"[^\"]*\"/\1=\"$V.0\"/; s/(short_version|application\/version)=\"[^\"]*\"/\1=\"$V\"/" export_presets.cfg
            echo "Version : $V"
          else
            echo "Pas de version (ou format inattendu : '$V') : valeurs du dépôt conservées."
          fi
          grep "config/version" project.godot

      - name: Importer et exporter
        run: |
          "$RUNNER_TEMP/godot" --headless --editor --quit || true
          mkdir -p build
          "$RUNNER_TEMP/godot" --headless --export-release "Windows Desktop" build/RondeDesVeilleurs.exe
          pip install --quiet pillow
          python3 tools/peicon.py build/RondeDesVeilleurs.exe art/icon_1024.png
          mkdir -p build/linux
          "$RUNNER_TEMP/godot" --headless --export-release "Linux" build/linux/RondeDesVeilleurs.x86_64
          cp art/icon.png build/linux/RondeDesVeilleurs.png
          tar -czf build/RondeDesVeilleurs_Linux_SteamDeck.tar.gz -C build/linux .
          # macOS : application universelle (Intel + Apple Silicon), signature ad hoc (non validée par Apple)
          mkdir -p build/macos
          "$RUNNER_TEMP/godot" --headless --export-release "macOS" build/macos/RondeDesVeilleurs.zip
          cp build/macos/RondeDesVeilleurs.zip build/RondeDesVeilleurs_macOS.zip
          cd build && zip -9 RondeDesVeilleurs_Windows.zip RondeDesVeilleurs.exe

      - name: Artefact
        uses: actions/upload-artifact@v6
        with:
          name: RondeDesVeilleurs
          path: |
            build/RondeDesVeilleurs_Windows.zip
            build/RondeDesVeilleurs_Linux_SteamDeck.tar.gz
            build/RondeDesVeilleurs_macOS.zip

      - name: Release (tag ou Release publiée)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/RondeDesVeilleurs_Windows.zip
            build/RondeDesVeilleurs_Linux_SteamDeck.tar.gz
            build/RondeDesVeilleurs_macOS.zip

      - name: Release (lancement manuel avec version)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: La Ronde des Veilleurs ${{ inputs.version }}
          generate_release_notes: true
          body: |
            Roguelite coopératif (1 à 4 joueurs, en ligne ou sur le même écran). Pour jouer en ligne, tous les joueurs doivent avoir la même version.

            **Windows** : télécharger `RondeDesVeilleurs_Windows.zip`, décompresser et lancer `RondeDesVeilleurs.exe`.
            L'exe n'est pas encore signé : si Windows affiche « Windows a protégé votre ordinateur », cliquer *Informations complémentaires* → *Exécuter quand même*.

            **Linux / Steam Deck** : télécharger `RondeDesVeilleurs_Linux_SteamDeck.tar.gz`, extraire, lancer `RondeDesVeilleurs.x86_64` (voir le README pour l'ajouter à Steam).

            **macOS** (Intel et Apple Silicon) : télécharger `RondeDesVeilleurs_macOS.zip`, décompresser, glisser *La Ronde des Veilleurs* dans Applications.
            L'app n'est pas validée par Apple : au premier lancement, faire **clic droit → Ouvrir** puis **Ouvrir**
            (sur macOS 15 : Réglages Système → Confidentialité et sécurité → « Ouvrir quand même »).
            Si macOS dit que l'app est « endommagée » : dans le Terminal, `xattr -cr "/Applications/La Ronde des Veilleurs.app"`.
          files: |
            build/RondeDesVeilleurs_Windows.zip
            build/RondeDesVeilleurs_Linux_SteamDeck.tar.gz
            build/RondeDesVeilleurs_macOS.zip
